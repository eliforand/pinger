{% extends "base.html" %}
{% block title %}Первый запуск — pinger{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card shadow-sm">
    <h1>Первый запуск</h1>
    <p class="text-secondary small">Создайте администратора — после этого сервис будет доступен только по паролю.</p>
    <form method="post" action="/setup">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="form-label">Логин</label>
      <input class="form-control" name="username" autocomplete="username" required autofocus>
      <label class="form-label mt-2">Пароль (минимум 8 символов)</label>
      <input class="form-control" name="password" type="password" autocomplete="new-password" required minlength="8">
      {% if setup_token_required %}
      <label class="form-label mt-2">Setup-токен</label>
      <input class="form-control" name="setup_token" type="password" required>
      {% endif %}
      {% if error %}<div class="alert alert-danger alert-error error mt-2" role="alert">{{ error }}</div>{% endif %}
      <button type="submit" class="btn btn-primary">Создать администратора</button>
    </form>
  </div>
</div>
{% endblock %}
