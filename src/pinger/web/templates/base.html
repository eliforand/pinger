<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pinger{% endblock %}</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/status.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script>
    // Тема до отрисовки, чтобы не было вспышки.
    (function () {
      var saved = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-bs-theme", saved);
    })();
  </script>
</head>
<body>
  <nav class="navbar navbar-expand border-bottom">
    <div class="container">
      <a class="navbar-brand" href="/"><span class="brand-dot"></span>pinger</a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        {% if user %}
          {% if user.role == 'admin' %}<a class="nav-link" href="/users">Пользователи</a>{% endif %}
          <a class="nav-link" href="/profile">Профиль</a>
          <span class="badge text-bg-secondary badge-user">{{ user.username }}</span>
          <form method="post" action="/logout" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="btn btn-outline-secondary">Выйти</button>
          </form>
        {% else %}
          <a class="nav-link" href="/login">Войти</a>
        {% endif %}
        <button type="button" id="theme-toggle" class="btn btn-outline-secondary"
                title="Переключить тему" aria-label="Переключить тему">◐</button>
      </div>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
