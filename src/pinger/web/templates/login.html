{% extends "base.html" %}
{% block title %}Вход — pinger{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card shadow-sm">
    <h1>Вход</h1>
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="form-label">Логин</label>
      <input class="form-control" name="username" autocomplete="username" required autofocus>
      <label class="form-label mt-2">Пароль</label>
      <input class="form-control" name="password" type="password" autocomplete="current-password" required>
      {% if error %}<div class="alert alert-danger alert-error mt-2" role="alert">{{ error }}</div>{% endif %}
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
