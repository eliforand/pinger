[project]
name = "pinger"
version = "0.1.0"
description = "Сервис пинга через fping + веб-интерфейс"
readme = "README.md"
authors = [
    { name = "Alex", email = "alex@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "argon2-cffi",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"